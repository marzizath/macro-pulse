# Fly.io deploy config (spec section 9, Phase 5).
# From the repo root: `fly launch --dockerfile backend/Dockerfile --no-deploy`
# to generate an app, then adjust `app` below and `fly deploy`.
#
# Create the volume once: `fly volumes create net_reconciler_data --size 1`
# so SQLite persists across deploys - it lives outside the container image.

app = "net-reconciler"
primary_region = "syd"

[build]
  dockerfile = "backend/Dockerfile"

[env]
  DATABASE_PATH = "/data/ledger.db"
  DATA_SOURCE = "basiq"
  CORS_ORIGINS = "https://net-reconciler.vercel.app"

[mounts]
  source = "net_reconciler_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
